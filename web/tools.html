<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TIVOX ($TVX) developer tools: view token data, check wallet balances, and send test TVX on Sepolia with MetaMask." />
    <meta name="robots" content="noindex" />
    <title>TIVOX Tools — Sepolia Dev Tools</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Sepolia ERC-20</p>
          <h1>TIVOX</h1>
          <p class="lede">Developer tools only — view token data, check wallet balances, and send test TVX with MetaMask.</p>
        </div>
        <button id="connectWallet" type="button">Connect Wallet</button>
      </section>

      <section class="panel">
        <label for="contractAddress">Contract address</label>
        <div class="row">
          <input id="contractAddress" type="text" placeholder="0x..." autocomplete="off" />
          <button id="loadToken" type="button">Load</button>
        </div>
        <p id="status" class="status">Paste the Sepolia contract address, then load token data.</p>
      </section>

      <section class="grid">
        <article class="metric">
          <span>Name</span>
          <strong id="tokenName">-</strong>
        </article>
        <article class="metric">
          <span>Symbol</span>
          <strong id="tokenSymbol">-</strong>
        </article>
        <article class="metric">
          <span>Total Supply</span>
          <strong id="totalSupply">-</strong>
        </article>
        <article class="metric">
          <span>Your Balance</span>
          <strong id="walletBalance">-</strong>
        </article>
      </section>

      <section class="panel">
        <h2>Send Test Tokens</h2>
        <label for="recipient">Recipient</label>
        <input id="recipient" type="text" placeholder="0x..." autocomplete="off" />
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0" step="0.000001" value="10" />
        <button id="sendTokens" type="button">Send TVX</button>
      </section>

      <section class="links">
        <a id="etherscanLink" href="https://sepolia.etherscan.io" target="_blank" rel="noreferrer">View on Sepolia Etherscan</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
