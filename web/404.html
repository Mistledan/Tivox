<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TIVOX — page not found</title>
<link rel="icon" href="./assets/mascot.png">
<style>
  :root { --neon: #39ff14; --neon-glow: rgba(57,255,20,0.6); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #10101a 0%, #05050a 60%);
    color: #f2f2f2;
    font-family: 'Segoe UI', Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .code {
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--neon);
    text-shadow: 0 0 10px var(--neon-glow), 0 0 40px var(--neon-glow);
  }
  p { color: #aaa; margin: 18px 0 28px; font-size: 1.05rem; }
  .btn {
    display: inline-block;
    background: var(--neon);
    color: #000;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 999px;
    text-decoration: none;
    letter-spacing: 1px;
    box-shadow: 0 0 20px var(--neon-glow);
  }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <p>The ox wandered off the path. This page doesn't exist.</p>
    <a class="btn" href="./index.html">Back to TIVOX</a>
  </main>
</body>
</html>
